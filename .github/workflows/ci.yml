name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: personal_blog_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/personal_blog_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/personal_blog_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Validate operations scripts
        run: bash -n scripts/*.sh
      - name: Test privacy-safe Nginx logs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          python3 scripts/test-nginx-log-summary.py
          python3 scripts/verify-amap-logging.py
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder
        run: |
          cp .env.example .env
          docker compose config --quiet
      - run: npm test
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Build production Linux container
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag personal-blog:ci .
      - name: Verify production container runtime
        run: bash scripts/verify-container-ci.sh
      - name: Export verified release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-image
          docker save personal-blog:ci | gzip -1 > release-image/personal-blog.tar.gz
          docker image inspect personal-blog:ci --format '{{.Id}}' > release-image/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > release-image/commit.txt
          cd release-image
          sha256sum personal-blog.tar.gz > SHA256SUMS
      - name: Retain verified image for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ github.sha }}
          path: release-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
